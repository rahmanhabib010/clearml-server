http_address = "0.0.0.0:4180"

provider = "oidc"
provider_display_name = "Authentik"
oidc_issuer_url = "https://authentik.ccixgtestbed.org/application/o/clearml/"
redirect_url = "http://localhost:8080/oauth2/callback"
scope = "openid email profile"

email_domains = [ "*" ]
upstreams = [ "http://sso-bridge:5000/" ]

reverse_proxy = true
skip_provider_button = true

set_xauthrequest = true
pass_user_headers = true
pass_authorization_header = false
pass_access_token = false
session_cookie_minimal = true
code_challenge_method = "S256"

cookie_name = "_clearml_oauth2_proxy"
cookie_secure = false
cookie_samesite = "lax"
cookie_refresh = "0"
cookie_expire = "8h"

# Authentik is the trusted identity provider for this deployment. This avoids
# blocking users whose email_verified claim is not populated by the provider.
insecure_oidc_allow_unverified_email = true
